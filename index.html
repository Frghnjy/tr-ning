<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Theos Træning</title>
    
    <!-- PWA settings til iPhone & Android -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Theos Træning">
    <meta name="theme-color" content="#000000">

    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #ffffff;
            --accent-color: #ff4757;
            --text-color: #000000;
            --text-dim: #555555;
            --disabled-color: #333333;
            --success-color: #2ed573;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: #ffffff;
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            -webkit-tap-highlight-color: transparent;
        }

        h1 { margin-bottom: 20px; font-size: 26px; text-align: center; font-weight: 800; letter-spacing: 0.5px; color: #ffffff; }

        .tabs-container {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
            max-width: 500px;
            margin-bottom: 20px;
        }

        .tab-btn {
            background-color: #ffffff;
            color: #000000;
            border: none;
            padding: 10px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
        }

        .tab-btn.active { background-color: var(--accent-color); color: #ffffff; }
        .tab-btn.disabled { background-color: var(--disabled-color); color: #888888; cursor: not-allowed; opacity: 0.5; }

        .tab-content { display: none; width: 100%; max-width: 450px; }
        .tab-content.active { display: block; }

        .exercise-card {
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 1px solid #dddddd;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 4px 10px rgba(255,255,255,0.1);
        }

        .exercise-title { font-size: 17px; font-weight: bold; margin-bottom: 12px; color: #000000; }

        .media-container {
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .media-container video, .media-container img { width: 100%; height: auto; border-radius: 8px; }

        .placeholder-box {
            width: 100%;
            padding: 20px 0;
            background-color: #f5f5f5;
            border: 2px dashed #ccc;
            border-radius: 8px;
            text-align: center;
            color: var(--text-dim);
            font-weight: 500;
        }

        .upload-btn-wrapper { margin-top: 10px; display: flex; gap: 8px; }
        .upload-btn {
            background-color: #e0e0e0;
            color: #000000;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            display: inline-block;
            border: 1px solid #ccc;
            font-weight: 600;
        }
        .remove-btn {
            background-color: #ff4757;
            color: #fff;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            border: none;
        }
        .file-input { display: none; }

        .sets-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #eee;
        }

        .log-input-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .set-label {
            font-size: 12px;
            font-weight: bold;
            color: var(--text-dim);
            width: 45px;
        }

        .log-input-wrapper {
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .log-input-wrapper label {
            font-size: 11px;
            color: var(--text-dim);
            margin-bottom: 4px;
            text-transform: uppercase;
            font-weight: bold;
        }

        .log-input {
            width: 100%;
            padding: 8px;
            background-color: #f9f9f9;
            border: 1px solid #ccc;
            border-radius: 6px;
            color: #000000;
            font-size: 14px;
            box-sizing: border-box;
            font-weight: 600;
        }

        .timer-wrapper {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #eee;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .timer-controls { display: flex; align-items: center; gap: 6px; }

        .timer-display {
            font-family: monospace;
            font-size: 18px;
            font-weight: bold;
            color: var(--accent-color);
            min-width: 55px;
        }

        .timer-btn {
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-start { background-color: #2ed573; }
        .btn-stop { background-color: #ff4757; }

        .run-select {
            background-color: #f0f0f0;
            color: #000000;
            border: 1px solid #ccc;
            padding: 5px;
            border-radius: 6px;
            font-weight: 600;
        }

        .calendar-container { background-color: var(--card-bg); padding: 16px; border-radius: 12px; border: 1px solid #dddddd; color: #000000; margin-bottom: 20px; }
        .month-header { font-size: 16px; font-weight: 800; text-align: center; margin: 15px 0 8px 0; color: #000000; text-transform: capitalize; border-bottom: 2px solid #f0f0f0; padding-bottom: 4px; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
        .day-name { font-weight: bold; color: var(--text-dim); font-size: 11px; padding-bottom: 4px; }
        
        .day-cell {
            background-color: #f0f0f0;
            color: #000000;
            padding: 6px 2px;
            border-radius: 6px;
            min-height: 50px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
            border: 1px solid #e0e0e0;
        }

        .day-cell.empty { background-color: transparent; border: none; cursor: default; }
        .day-cell.trained { border: 2px solid var(--success-color); background-color: #e8fae8; }
        .check-mark { color: var(--success-color); font-weight: bold; font-size: 16px; margin-top: 2px; }
        .weight-tag { font-size: 10px; color: var(--accent-color); font-weight: bold; margin-top: 2px; }
        
        .cal-btn {
            background-color: #000000;
            border: none;
            color: #fff;
            font-size: 9px;
            padding: 3px 5px;
            border-radius: 4px;
            margin-top: 2px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>Theos Træning</h1>

    <div class="tabs-container">
        <button class="tab-btn active" onclick="openTab('mandag')">Mandag</button>
        <button class="tab-btn" onclick="openTab('tirsdag')">Tirsdag</button>
        <button class="tab-btn" onclick="openTab('onsdag')">Onsdag</button>
        <button class="tab-btn disabled">Torsdag (Rest)</button>
        <button class="tab-btn" onclick="openTab('fredag')">Fredag</button>
        <button class="tab-btn disabled">Lørdag (Rest)</button>
        <button class="tab-btn" onclick="openTab('sondag')">Søndag</button>
        <button class="tab-btn" onclick="openTab('dage')">Dage</button>
        <button class="tab-btn" onclick="openTab('vaegt')">Vægt</button>
    </div>

    <div id="mandag" class="tab-content active"><div id="list-mandag"></div></div>
    <div id="tirsdag" class="tab-content"><div id="list-tirsdag"></div></div>
    <div id="onsdag" class="tab-content"><div id="list-onsdag"></div></div>
    <div id="fredag" class="tab-content"><div id="list-fredag"></div></div>
    <div id="sondag" class="tab-content"><div id="list-sondag"></div></div>
    
    <div id="dage" class="tab-content">
        <div class="calendar-container">
            <h3 style="margin:0 0 10px 0; font-size: 18px; text-align: center; color: #000;">Træningskalender</h3>
            <div id="training-calendar-months"></div>
        </div>
    </div>

    <div id="vaegt" class="tab-content">
        <div class="exercise-card" style="margin-bottom: 20px;">
            <div class="exercise-title">Billede</div>
            <div class="media-container" id="media-vaegt-card">
                <div class="placeholder-box">Ingen mediefil tilføjet</div>
            </div>
            <div class="upload-btn-wrapper">
                <label class="upload-btn">Vælg Billede
                    <input type="file" class="file-input" accept="image/*" onchange="savePermanentImage(event, 'vaegt-card')">
                </label>
            </div>
        </div>

        <div class="calendar-container">
            <h3 style="margin:0 0 10px 0; font-size: 18px; text-align: center; color: #000;">Vægtkalender</h3>
            <div id="weight-calendar-months"></div>
        </div>
    </div>

    <script>
        const program = {
            mandag: [
                { id: 'm1', name: 'Pec Deck Fly' },
                { id: 'm2', name: 'Machine Shoulder Press' },
                { id: 'm3', name: 'Seated Machine Triceps Dip' },
                { id: 'm4', name: 'Cable V-Bar Overhead Triceps Extension' },
                { id: 'm5', name: 'Lateral Raise' }
            ],
            tirsdag: [
                { id: 't1', name: 'Close Grip Cable Lat Pulldown' },
                { id: 't2', name: 'Cable Row' },
                { id: 't3', name: 'Machine Row' },
                { id: 't4', name: 'Machine Rear Delt Fly' },
                { id: 't5', name: 'Hammer Curl' },
                { id: 't6', name: 'Bayesian Curl' }
            ],
            onsdag: [
                { id: 'o1', name: 'Løb - 2-5 min', isRun: true },
                { id: 'o2', name: 'Leg Extension' },
                { id: 'o3', name: 'Leg Press' },
                { id: 'o4', name: 'Calf Raise Seated' },
                { id: 'o5', name: 'Kneeling Cable Crunch' },
                { id: 'o6', name: 'Loaded Crunch' },
                { id: 'o7', name: 'Hip Adduction' },
                { id: 'o8', name: 'Back Extensions' }
            ],
            fredag: [
                { id: 'f1', name: 'Pec Deck Fly' },
                { id: 'f2', name: 'Wide Grip Lat Pulldown' },
                { id: 'f3', name: 'Overhand Grip Cable Row' },
                { id: 'f4', name: 'Preacher Curl' },
                { id: 'f5', name: 'Lying Chest Press' },
                { id: 'f6', name: 'Cable V Bar Pushdown' },
                { id: 'f7', name: 'Single Arm Tricep Pushdown' },
                { id: 'f8', name: 'Lateral Raise' }
            ],
            sondag: [
                { id: 's1', name: 'Løb - 2-5 min', isRun: true },
                { id: 's2', name: 'Leg Extensions' },
                { id: 's3', name: 'Seated Hamstring Curl' },
                { id: 's4', name: 'Leg Press' },
                { id: 's5', name: 'Kneeling Cable Crunch' },
                { id: 's6', name: 'Back Extension' }
            ]
        };

        function renderProgram() {
            Object.keys(program).forEach(day => {
                const container = document.getElementById(`list-${day}`);
                if (!container) return;

                program[day].forEach((ex) => {
                    const containerId = `media-${ex.id}`;
                    const timerId = `timer-${ex.id}`;
                    const savedMedia = localStorage.getItem(`media-data-${ex.id}`);

                    let mediaHtml = `<div class="placeholder-box">Ingen mediefil tilføjet</div>`;
                    if (savedMedia) {
                        mediaHtml = `<img src="${savedMedia}" />`;
                    }

                    let uploadHtml = `
                        <div class="upload-btn-wrapper">
                            <label class="upload-btn">Vælg Billede
                                <input type="file" class="file-input" accept="image/*" onchange="savePermanentImage(event, '${ex.id}')">
                            </label>
                            ${savedMedia ? `<button class="remove-btn" onclick="removeImage('${ex.id}')">Slet</button>` : ''}
                        </div>`;

                    let inputGroupHtml = '';

                    if (ex.isRun) {
                        const savedMin = localStorage.getItem(`min-${ex.id}`) || '';
                        const savedKm = localStorage.getItem(`km-${ex.id}`) || '';
                        inputGroupHtml = `
                            <div class="sets-container">
                                <div class="log-input-group">
                                    <div class="log-input-wrapper">
                                        <label>Tid (min)</label>
                                        <input type="number" step="any" class="log-input" placeholder="0" value="${savedMin}" onchange="saveLog('min-${ex.id}', this.value)">
                                    </div>
                                    <div class="log-input-wrapper">
                                        <label>KM</label>
                                        <input type="number" step="any" class="log-input" placeholder="0" value="${savedKm}" onchange="saveLog('km-${ex.id}', this.value)">
                                    </div>
                                </div>
                            </div>`;
                    } else {
                        let setsHtml = '';
                        for (let s = 1; s <= 3; s++) {
                            const savedKg = localStorage.getItem(`kg-${ex.id}-s${s}`) || '';
                            const savedReps = localStorage.getItem(`reps-${ex.id}-s${s}`) || '';
                            setsHtml += `
                                <div class="log-input-group">
                                    <span class="set-label">Sæt ${s}</span>
                                    <div class="log-input-wrapper">
                                        <label>KG</label>
                                        <input type="number" step="any" class="log-input" placeholder="0" value="${savedKg}" onchange="saveLog('kg-${ex.id}-s${s}', this.value)">
                                    </div>
                                    <div class="log-input-wrapper">
                                        <label>REPS</label>
                                        <input type="number" class="log-input" placeholder="0" value="${savedReps}" onchange="saveLog('reps-${ex.id}-s${s}', this.value)">
                                    </div>
                                </div>`;
                        }
                        inputGroupHtml = `<div class="sets-container">${setsHtml}</div>`;
                    }

                    let timerControls = ex.isRun ? `
                        <select id="select-${timerId}" class="run-select">
                            <option value="120">2 min</option>
                            <option value="180">3 min</option>
                            <option value="240">4 min</option>
                            <option value="300">5 min</option>
                        </select>
                        <button class="timer-btn btn-start" onclick="startCustomTimer('${timerId}')">Start</button>
                        <button class="timer-btn btn-stop" onclick="stopTimer('${timerId}')">Stop</button>
                    ` : `
                        <button class="timer-btn btn-start" onclick="startTimer('${timerId}', 120)">Start</button>
                        <button class="timer-btn btn-stop" onclick="stopTimer('${timerId}')">Stop</button>
                    `;

                    const card = document.createElement('div');
                    card.className = 'exercise-card';
                    card.innerHTML = `
                        <div class="exercise-title">${ex.name}</div>
                        <div class="media-container" id="${containerId}">${mediaHtml}</div>
                        ${uploadHtml}
                        ${inputGroupHtml}
                        <div class="timer-wrapper">
                            <div class="timer-controls">${timerControls}</div>
                            <div class="timer-display" id="${timerId}">02:00</div>
                        </div>
                    `;
                    container.appendChild(card);
                });
            });

            const savedVaegtMedia = localStorage.getItem('media-data-vaegt-card');
            if (savedVaegtMedia) {
                const vaegtContainer = document.getElementById('media-vaegt-card');
                if (vaegtContainer) {
                    vaegtContainer.innerHTML = `<img src="${savedVaegtMedia}" />`;
                }
            }
        }

        function autoMarkTodayTrained() {
            const now = new Date();
            const dateKey = `train-${now.getFullYear()}-${now.getMonth() + 1}-${now.getDate()}`;
            localStorage.setItem(dateKey, 'true');
        }

        function saveLog(key, value) {
            localStorage.setItem(key, value);
            if (value.trim() !== '') {
                autoMarkTodayTrained();
            }
        }

        function savePermanentImage(event, exId) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.src = e.target.result;
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 600;
                    const scaleSize = MAX_WIDTH / img.width;
                    canvas.width = MAX_WIDTH;
                    canvas.height = img.height * scaleSize;

                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                    const compressedBase64 = canvas.toDataURL('image/jpeg', 0.7);
                    
                    try {
                        localStorage.setItem(`media-data-${exId}`, compressedBase64);
                        location.reload();
                    } catch(err) {
                        alert("Billedfilen er for stor til at gemme i browserens hukommelse.");
                    }
                };
            };
            reader.readAsDataURL(file);
        }

        function removeImage(exId) {
            localStorage.removeItem(`media-data-${exId}`);
            location.reload();
        }

        function openTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));

            document.getElementById(tabName).classList.add('active');
            event.currentTarget.classList.add('active');

            if (tabName === 'dage') renderTrainingCalendar();
            if (tabName === 'vaegt') renderWeightCalendar();
        }

        let activeTimers = {};
        let timerTimeLeft = {};

        function playDingSound() {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(880, ctx.currentTime);
            gain.gain.setValueAtTime(1, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.2);

            osc.connect(gain);
            gain.connect(ctx.destination);

            osc.start();
            osc.stop(ctx.currentTime + 1.2);
        }

        function startCustomTimer(timerId) {
            const seconds = parseInt(document.getElementById(`select-${timerId}`).value);
            startTimer(timerId, seconds);
        }

        function startTimer(timerId, durationSeconds) {
            if (activeTimers[timerId]) clearInterval(activeTimers[timerId]);

            timerTimeLeft[timerId] = durationSeconds;
            const display = document.getElementById(timerId);

            updateDisplay(display, timerTimeLeft[timerId]);

            activeTimers[timerId] = setInterval(() => {
                timerTimeLeft[timerId]--;
                updateDisplay(display, timerTimeLeft[timerId]);

                if (timerTimeLeft[timerId] <= 0) {
                    clearInterval(activeTimers[timerId]);
                    playDingSound();
                }
            }, 1000);
        }

        function stopTimer(timerId) {
            if (activeTimers[timerId]) {
                clearInterval(activeTimers[timerId]);
                activeTimers[timerId] = null;
            }
        }

        function updateDisplay(element, seconds) {
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = (seconds % 60).toString().padStart(2, '0');
            element.innerText = `${m}:${s}`;
        }

        function getFirstDayOffset(year, month) {
            const day = new Date(year, month, 1).getDay();
            return day === 0 ? 6 : day - 1; // Mandag = 0, Søndag = 6
        }

        function renderTrainingCalendar() {
            const container = document.getElementById('training-calendar-months');
            container.innerHTML = '';

            const today = new Date();
            const startYear = today.getFullYear();
            const startMonth = today.getMonth();

            for (let m = 0; m < 12; m++) {
                const date = new Date(startYear, startMonth + m, 1);
                const year = date.getFullYear();
                const month = date.getMonth();
                const monthName = date.toLocaleString('da-DK', { month: 'long', year: 'numeric' });
                const daysInMonth = new Date(year, month + 1, 0).getDate();
                const firstDayOffset = getFirstDayOffset(year, month);

                const monthSection = document.createElement('div');
                monthSection.innerHTML = `
                    <div class="month-header">${monthName}</div>
                    <div class="calendar-grid">
                        <div class="day-name">Man</div><div class="day-name">Tir</div><div class="day-name">Ons</div>
                        <div class="day-name">Tor</div><div class="day-name">Fre</div><div class="day-name">Lør</div>
                        <div class="day-name">Søn</div>
                    </div>
                    <div class="calendar-grid" id="train-grid-${year}-${month}"></div>
                `;
                container.appendChild(monthSection);

                const grid = document.getElementById(`train-grid-${year}-${month}`);

                for (let i = 0; i < firstDayOffset; i++) {
                    const emptyCell = document.createElement('div');
                    emptyCell.className = 'day-cell empty';
                    grid.appendChild(emptyCell);
                }

                for (let day = 1; day <= daysInMonth; day++) {
                    const dateKey = `train-${year}-${month + 1}-${day}`;
                    const isTrained = localStorage.getItem(dateKey) === 'true';

                    const cell = document.createElement('div');
                    cell.className = `day-cell ${isTrained ? 'trained' : ''}`;
                    cell.innerHTML = `<span>${day}</span>${isTrained ? '<span class="check-mark">✓</span>' : ''}`;

                    cell.onclick = () => {
                        const newState = !isTrained;
                        localStorage.setItem(dateKey, newState);
                        renderTrainingCalendar();
                    };

                    grid.appendChild(cell);
                }
            }
        }

        function renderWeightCalendar() {
            const container = document.getElementById('weight-calendar-months');
            container.innerHTML = '';

            const today = new Date();
            const startYear = today.getFullYear();
            const startMonth = today.getMonth();

            for (let m = 0; m < 12; m++) {
                const date = new Date(startYear, startMonth + m, 1);
                const year = date.getFullYear();
                const month = date.getMonth();
                const monthName = date.toLocaleString('da-DK', { month: 'long', year: 'numeric' });
                const daysInMonth = new Date(year, month + 1, 0).getDate();
                const firstDayOffset = getFirstDayOffset(year, month);

                const monthSection = document.createElement('div');
                monthSection.innerHTML = `
                    <div class="month-header">${monthName}</div>
                    <div class="calendar-grid">
                        <div class="day-name">Man</div><div class="day-name">Tir</div><div class="day-name">Ons</div>
                        <div class="day-name">Tor</div><div class="day-name">Fre</div><div class="day-name">Lør</div>
                        <div class="day-name">Søn</div>
                    </div>
                    <div class="calendar-grid" id="weight-grid-${year}-${month}"></div>
                `;
                container.appendChild(monthSection);

                const grid = document.getElementById(`weight-grid-${year}-${month}`);

                for (let i = 0; i < firstDayOffset; i++) {
                    const emptyCell = document.createElement('div');
                    emptyCell.className = 'day-cell empty';
                    grid.appendChild(emptyCell);
                }

                for (let day = 1; day <= daysInMonth; day++) {
                    const dateKey = `weight-${year}-${month + 1}-${day}`;
                    const savedWeight = localStorage.getItem(dateKey) || '';

                    const cell = document.createElement('div');
                    cell.className = 'day-cell';
                    
                    let content = `<span>${day}</span>`;
                    if (savedWeight) content += `<span class="weight-tag">${savedWeight} kg</span>`;
                    cell.innerHTML = content;

                    const btn = document.createElement('button');
                    btn.className = 'cal-btn';
                    btn.innerText = 'Vægt';
                    btn.onclick = (e) => {
                        e.stopPropagation();
                        const input = prompt(`Indtast vægt for d. ${day}/${month + 1}:`, savedWeight);
                        if (input !== null) {
                            localStorage.setItem(dateKey, input.trim());
                            renderWeightCalendar();
                        }
                    };

                    cell.appendChild(btn);
                    grid.appendChild(cell);
                }
            }
        }

        renderProgram();
